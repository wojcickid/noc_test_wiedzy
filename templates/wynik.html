<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyniki Testu</title>
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0 auto;
            max-width: 600px;
            padding: 20px;
            text-align: center; /* Centruje tekst na stronie */
        }
        h1 {
            color: #007BFF;
        }
        p {
            margin: 20px 0; /* Dodaje marginesy dookoła paragrafów */
        }
        a {
            display: inline-block;
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none; /* Usuwa podkreślenie tekstu */
            margin-top: 20px;
        }
        a:hover {
            background-color: #0056b3;
        }
        .wynik {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa; /* Lekkie tło dla kontenera wyniku */
        }
        footer {
            margin-top: 40px;
            font-size: 0.8em;
            text-align: center;
            color: #666;
        }
        .nocowanie { color: blue; }
        .pl { color: red; }
    </style>
</head>
<body>
    <h1>Wyniki Testu</h1>
    <div class="wynik">
        <p>Dziękujemy za wypełnienie testu! Oto Twój wynik:</p>
        <p><strong>Poprawne odpowiedzi: {{ poprawne }}</strong></p>
        <p><strong>Wszystkie pytania: {{ wszystkie }}</strong></p>
    </div>
    <a href="/">Powrót do strony głównej</a>
    <footer>
        &copy; 2024 Zespół Analiz <span class="nocowanie">Nocowanie</span><span class="pl">.pl</span><br>
        demo v0.1
    </footer>
</body>

</html>
